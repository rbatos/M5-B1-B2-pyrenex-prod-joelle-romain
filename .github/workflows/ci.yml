name: CI/CD Pyrenex Prod

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model deps
        run: pip install -r services/model/requirements.txt pytest httpx
      - name: Tests unitaires + contract test du modèle
        run: pytest -v services/model/tests

  # TODO 1 (M5-B2) — job `evaluate-model` :
  #   needs: test ; lance `python scripts/evaluate_model.py --release-tag <ref>`
  #   qui DOIT bloquer (exit≠0) si une métrique passe sous les seuils.
  #   Uploadez mlruns/ en artefact.
  evaluate-model:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install eval deps
        run: pip install -r services/model/requirements.txt mlflow pandas scikit-learn
      - name: Évaluer le modèle vs seuils (golden run)
        run: python scripts/evaluate_model.py --release-tag ${{ github.ref }}
      - name: Upload mlruns (artefact de traçabilité)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-${{ github.run_id }}
          path: mlruns/

  build:
    needs: [test, evaluate-model]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the model
        run: python scripts/evaluate_model.py --release-tag ${{ github.ref }}

  build-and-push:
    needs: [test, evaluate-model]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        run: |
          REPO_LC=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${REPO_LC}/model" >> $GITHUB_ENV

      - name: Build model image
        run: |
          docker build \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            -t "${IMAGE_NAME}:latest" \
            -t "${IMAGE_NAME}:${GITHUB_REF_NAME}" \
            ./services/model

      - name: Push model image
        run: |
          docker push --all-tags "${IMAGE_NAME}"
