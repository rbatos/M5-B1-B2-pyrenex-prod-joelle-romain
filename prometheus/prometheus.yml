global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "model"
    metrics_path: /metrics
    scrape_interval: 1s
    static_configs:
      - targets: ["model:8000"]

  - job_name: "backend"
    metrics_path: /metrics
    scrape_interval: 1s
    static_configs:
      - targets: ["backend:8001"]
